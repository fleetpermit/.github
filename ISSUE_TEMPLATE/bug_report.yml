name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: please do **not** file them here. Use the repository's Security tab → "Report a vulnerability".
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Manifests (with names and identities anonymised) and commands. A failing test or lab scenario is ideal.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Relevant status
      description: Output of `kubectl get fap,tal -o yaml` (conditions) and, if relevant, the ManifestWork status.
      render: yaml
  - type: input
    id: versions
    attributes:
      label: Versions
      description: FleetPermit, Kubernetes, Open Cluster Management, kube-agentic-networking
    validations:
      required: true
